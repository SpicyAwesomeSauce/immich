name: Build unsigned iOS IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3.6

      - uses: subosito/flutter-action@v2
        with:
          # use the version pinned in mobile/.fvmrc (or mise.toml / pubspec) for v3.3.6
          flutter-version: "3.x.x"
          channel: stable

      - name: Build
        working-directory: mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r mobile/build/ios/iphoneos/Runner.app Payload/
          zip -r Immich-v3.3.6.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: immich-ipa
          path: Immich-v3.3.6.ipa
