name: Build unsigned iOS IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3.6

      - name: Use newest installed Xcode
        run: |
          ls -d /Applications/Xcode_*.app | sort -V
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ./mobile

      - name: Rust iOS targets
        run: rustup target add aarch64-apple-ios

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Build (no codesign)
        working-directory: ./mobile
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r mobile/build/ios/iphoneos/Runner.app Payload/
          zip -r Immich-v3.3.6.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: immich-ipa
          path: Immich-v3.3.6.ipa
