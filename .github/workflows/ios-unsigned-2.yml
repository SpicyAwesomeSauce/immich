name: Build unsigned iOS IPA
on: workflow_dispatch

env:
  MISE_EXPERIMENTAL: "1"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3.6

      - name: Use newest installed Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install mise and tools (unlocked)
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          mise trust --all || true
          mise install
          cd mobile && mise install

      - name: Rust iOS target
        run: rustup target add aarch64-apple-ios || true

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Build (no codesign)
        working-directory: ./mobile
        run: mise x -- flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r mobile/build/ios/iphoneos/Runner.app Payload/
          zip -r Immich-v3.3.6.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: immich-ipa
          path: Immich-v3.3.6.ipa
